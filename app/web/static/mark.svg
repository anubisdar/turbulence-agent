<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"
     role="img" aria-labelledby="mark-title mark-desc">
  <title id="mark-title">Turbulence agent</title>
  <desc id="mark-desc">A panel instrument whose scale runs from smooth
    through to extreme turbulence.</desc>

  <rect x="4" y="4" width="112" height="112" rx="14" fill="#151A21"/>
  <rect x="4" y="4" width="112" height="112" rx="14" fill="none"
        stroke="#2E3944" stroke-width="1.5"/>
  <g fill="#3A4652">
    <circle cx="15" cy="15" r="3"/><circle cx="105" cy="15" r="3"/>
    <circle cx="15" cy="105" r="3"/><circle cx="105" cy="105" r="3"/>
  </g>

  <circle cx="60" cy="60" r="49" fill="#232B34"/>
  <circle cx="60" cy="60" r="46" fill="#161C23"/>
  <circle cx="60" cy="60" r="43" fill="#0A0E13"/>
  <circle cx="60" cy="60" r="43" fill="none" stroke="#39444F" stroke-width="1"/>

  <g stroke-width="8" fill="none" stroke-linecap="butt">
    <path d="M28.21 76.90 A36 36 0 0 1 25.39 50.08" stroke="var(--m-smooth, #28FF9A)"/>
    <path d="M26.17 47.69 A36 36 0 0 1 44.22 27.64" stroke="var(--m-light, #8FE86B)"/>
    <path d="M46.51 26.62 A36 36 0 0 1 73.49 26.62" stroke="var(--m-moderate, #FFD03A)"/>
    <path d="M75.78 27.64 A36 36 0 0 1 93.83 47.69" stroke="var(--m-severe, #FF7A45)"/>
    <path d="M94.61 50.08 A36 36 0 0 1 91.79 76.90" stroke="var(--m-extreme, #FF6060)"/>
  </g>

  <g stroke="#8899A8" stroke-width="1.5" stroke-linecap="round">
    <path d="M33.15 75.50 L22.76 81.50"/>
    <path d="M30.52 50.42 L19.10 46.71"/>
    <path d="M47.39 31.68 L42.51 20.72"/>
    <path d="M72.61 31.68 L77.49 20.72"/>
    <path d="M89.48 50.42 L100.90 46.71"/>
    <path d="M86.85 75.50 L97.24 81.50"/>
  </g>

  <circle cx="60" cy="60" r="21" fill="none" stroke="#1D242C" stroke-width="1"/>
  <path d="M60 60 L60 33" stroke="#E8EEF4" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="5" fill="#E8EEF4"/>
  <circle cx="60" cy="60" r="2" fill="#0A0E13"/>
</svg>
